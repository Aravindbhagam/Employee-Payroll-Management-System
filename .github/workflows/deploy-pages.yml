name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The client has no build step (Tailwind loads via CDN, ES modules
      # load directly in the browser) -- the only thing that needs to
      # happen before publishing is pointing it at the deployed API, since
      # there's no bundler to bake an env var in at build time.
      - name: Configure API base URL
        working-directory: client
        env:
          # The API's deployed base URL, e.g. https://payrollpro-api.onrender.com/api
          # Set this as a repository variable (Settings -> Secrets and
          # variables -> Actions -> Variables -> New variable, name API_URL)
          # once the backend is deployed (see render.yaml / DEPLOYMENT.md).
          API_URL: ${{ vars.API_URL }}
        run: |
          cat > config.js <<EOF
          window.APP_CONFIG = { apiBaseUrl: '${API_URL}' };
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
