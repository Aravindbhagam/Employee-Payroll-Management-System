name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payrollpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payrollpro_test
      PGSSL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # tests/conftest.py resets the schema of the Postgres service
        # container above via db/migrate.py's reset(); JWT secrets are
        # hardcoded there too, so no repository secrets are required here.
        run: python -m pytest

  client:
    name: Client (syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The client is plain HTML/CSS/JS with no build step (Tailwind loads
      # via CDN, ES modules load directly in the browser) -- `node --check`
      # is a cheap way to still catch syntax errors before they ship.
      - name: Syntax-check all JS modules
        run: |
          status=0
          for f in $(find src -name '*.js'); do
            node --input-type=module --check < "$f" || status=1
          done
          exit $status
