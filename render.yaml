services:
  - type: web
    name: payrollpro-api
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prod.db
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_MIN
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: REFRESH_TOKEN_TTL_DAYS_REMEMBER
        value: "30"
      # Set this to your deployed GitHub Pages origin, e.g.
      # https://<your-username>.github.io (no trailing slash, no path).
      # Comma-separate multiple origins if you also test against a local
      # dev frontend.
      - key: CLIENT_ORIGIN
        sync: false
