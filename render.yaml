services:
  - type: web
    name: payrollpro-api
    env: python
    plan: free
    region: oregon
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python db/migrate.py && python db/seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: payrollpro-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_MIN
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: REFRESH_TOKEN_TTL_DAYS_REMEMBER
        value: "30"
      # Set this to your deployed GitHub Pages origin, e.g.
      # https://<your-username>.github.io (no trailing slash, no path).
      # Comma-separate multiple origins if you also test against a local
      # dev frontend.
      - key: CLIENT_ORIGIN
        sync: false
      # Optional: leave blank to keep logging password-reset emails
      # server-side instead of sending them (see server/.env.example).
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: payrollpro-db
    plan: free
    region: oregon
