<!doctype html>
<!--
  GitHub Pages serves this file for any path it doesn't recognize as a real
  file (i.e. every client-side route, like /employees/123). It re-encodes the
  requested path into a query string and redirects to the app's real
  index.html, which decodes it back (see the inline script in index.html)
  and hands it to React Router. This is the standard SPA-on-GitHub-Pages
  workaround: https://github.com/rafgraph/spa-github-pages
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PayrollPro</title>
    <script type="text/javascript">
      // Number of path segments to keep as-is before the app route begins.
      // For a project page served at https://<user>.github.io/<repo>/..., this
      // is 1 (the "/<repo>" segment).
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
