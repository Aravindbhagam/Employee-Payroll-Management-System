<!doctype html>
<!--
  GitHub Pages has no server-side router: it serves this file for any URL
  that isn't a literal file on disk, which includes every client-side route
  in this app (e.g. /employees/123, /payroll/abc). We remember the path the
  visitor actually wanted in sessionStorage, then send them to the real
  index.html. That page reads the stashed path back and restores it with
  history.replaceState before React Router mounts (see the inline script in
  index.html), so deep links and page reloads land on the right screen.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PayrollPro</title>
    <script type="text/javascript">
      sessionStorage.setItem('payrollpro:pending-path', location.pathname + location.search + location.hash);
      // This app is always served as a GitHub Pages *project* site, i.e.
      // https://<user>.github.io/<repo>/... -- the first path segment is the
      // repo name and must be preserved as the base when redirecting home.
      var repoSegment = location.pathname.split('/')[1];
      location.replace('/' + repoSegment + '/');
    </script>
  </head>
  <body></body>
</html>
