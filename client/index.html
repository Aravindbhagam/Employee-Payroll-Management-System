<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayrollPro | Employee Payroll Management System</title>
    <!--
      Counterpart to public/404.html's redirect: reads the real path back out
      of sessionStorage (stashed there before GitHub Pages' 404 fallback sent
      the visitor here) and restores it with history.replaceState before
      React Router mounts, so deep links (e.g. /employees/123) and page
      reloads work correctly when served as a static SPA on GitHub Pages.
    -->
    <script type="text/javascript">
      (function () {
        var pendingPath = sessionStorage.getItem('payrollpro:pending-path');
        if (pendingPath) {
          sessionStorage.removeItem('payrollpro:pending-path');
          var current = location.pathname + location.search + location.hash;
          if (pendingPath !== current) {
            history.replaceState(null, '', pendingPath);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
